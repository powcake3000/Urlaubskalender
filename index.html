<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Urlaubskalender 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Team Urlaubskalender 2026</h1>
            <p class="subtitle">Planen Sie Ihren Urlaub und sehen Sie die Urlaubszeiten Ihrer Teammitglieder</p>
        </header>

        <div class="controls">
            <div class="team-member-selector">
                <label for="memberSelect">Teammitglied:</label>
                <select id="memberSelect">
                    <option value="">Wählen Sie ein Teammitglied...</option>
                </select>
            </div>
            <button id="addVacationBtn" class="btn btn-primary">Urlaub hinzufügen</button>
        </div>

        <div id="vacationModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Urlaub hinzufügen/bearbeiten</h2>
                <form id="vacationForm">
                    <div class="form-group">
                        <label for="memberName">Teammitglied:</label>
                        <select id="memberName" required>
                            <option value="">Wählen Sie...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="startDate">Startdatum:</label>
                        <input type="date" id="startDate" required min="2026-01-01" max="2026-12-31">
                    </div>
                    <div class="form-group">
                        <label for="endDate">Enddatum:</label>
                        <input type="date" id="endDate" required min="2026-01-01" max="2026-12-31">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Speichern</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn">Abbrechen</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="calendar-section">
            <div class="calendar-controls">
                <button id="prevMonth" class="btn btn-nav">&lt;</button>
                <h2 id="currentMonth"></h2>
                <button id="nextMonth" class="btn btn-nav">&gt;</button>
            </div>
            <div id="calendar" class="calendar-grid"></div>
        </div>

        <div class="legend">
            <h3>Legende</h3>
            <div class="legend-items" id="legendItems"></div>
        </div>

        <div class="vacation-list">
            <h3>Geplante Urlaube</h3>
            <div id="vacationListContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
